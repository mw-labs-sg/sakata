name: Spread report

# Standalone on purpose — leaves your existing curves/margins workflow alone.
# Runs on GitHub's IPs, which Yahoo serves normally; a hosted Streamlit app gets
# rate-limited instead, which is why the Spreads tab worked locally and came
# back empty anywhere else.

on:
  schedule:
    # 21:30 UTC weekdays = after the US cash close, before the Asia open.
    - cron: "30 21 * * 1-5"
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write           # the job commits docs/index.html back to the repo

concurrency:
  group: spread-report
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        # Only what report.py needs. Streamlit is deliberately absent — the
        # report generator imports sakata_stats, which has no Streamlit
        # dependency, so the Action stays light.
        run: pip install yfinance pandas numpy

      - name: Build report
        run: python report.py

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --quiet --cached || git commit -m "chore: rebuild spread report [skip ci]"
          git push
